name: Brandora AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop, test-demo-round3 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Verification (Pytest & Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: ./backend
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET: supersecret-demo-jwt-key-brandguard-2026
          DEMO_MODE: true
          TESTING: 1
          LLM_ENABLED: false
          SMTP_ENABLED: false
        run: |
          pytest backend/tests/ -v

  frontend-build:
    name: Frontend Verification (Typecheck & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Production Bundle Build (tsc & vite)
        working-directory: frontend
        run: npm run build
