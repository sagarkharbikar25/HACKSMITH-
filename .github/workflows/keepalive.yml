name: Keep-Alive Health Cron

on:
  schedule:
    - cron: "*/10 * * * *"  # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          URL="${{ secrets.BACKEND_PROD_URL || 'https://hacksmith.onrender.com/api/health' }}"
          echo "Pinging $URL ..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Backend responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Backend is healthy and awake!"
          else
            echo "Backend responded with HTTP $HTTP_CODE (warming up or restarting)"
          fi
