name: Keep-Alive Health Cron

on:
  schedule:
    - cron: "*/10 * * * *"  # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          # Replace with your production URL once deployed
          URL="${{ secrets.BACKEND_PROD_URL || 'https://brandguard-api.onrender.com/api/health' }}"
          echo "Pinging $URL ..."
          curl -s -f "$URL" || echo "Ping completed."
