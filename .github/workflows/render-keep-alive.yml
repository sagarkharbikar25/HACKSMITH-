name: Keep Render Backend Awake

on:
  schedule:
    # Ping every 10 minutes to prevent Render free instance from sleeping (spins down at 15m)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive health ping
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://hacksmith.onrender.com' }}
        run: |
          echo "Pinging Render backend at $BACKEND_URL/api/health..."
          curl -sS -m 30 "$BACKEND_URL/api/health" || curl -sS -m 30 "$BACKEND_URL/health" || echo "Keep-alive ping sent."
